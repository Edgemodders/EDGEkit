# Builds EDGEkit for Windows x64 on a clean runner: Code - OSS at upstream.json's tag, branded, with the
# EDGE extensions at the versions extensions.json pins (tools/build.ps1), then checks the build
# (tools/check-build.mjs). The same mechanism as REDnode's and the other repos' release workflows.
#
#   Run workflow (Actions tab)                  builds the app and EDGEkitSetup.exe and keeps the
#                                               installer as the run's artifact
#   Run workflow, "Make a release" ticked       also tags the commit v<version> (version.json), makes
#                                               the GitHub release with EDGEkitSetup-<version>.exe and
#                                               commits the update manifest (docs/update/), which offers
#                                               the update to every installed EDGEkit; stops first if
#                                               that tag exists, the version is not newer than the
#                                               manifest's, or CHANGELOG.md has no section for it
#                                               (tools/release.mjs)
#   ... and "Update Nexus Mods" ticked          also, after the update is on, uploads EDGEkit-<version>.zip
#                                               (the installer and a README, tools/nexus-zip.mjs) to the
#                                               Nexus page as the main file's new version (the old one
#                                               archived), adds its changelog (tools/nexus-notes.mjs) and
#                                               pushes nexus/description.bbcode (tools/nexus/nexus.mjs,
#                                               copied from REDnode; the organization's NEXUS_KEY secret).
#                                               It checks the page first and stops before building if the
#                                               description changed on Nexus since the last pull
#                                               (node tools/nexus/nexus.mjs pull, merge, commit, run
#                                               again). If the upload fails after the release, run
#                                               tools/nexus-zip.mjs and tools/nexus/nexus.mjs release on
#                                               the dev PC with the release's installer: it skips what is
#                                               already done (nexus/README.md)
#
# Release gate: make a release only after the run's installer has been installed and tested
# (docs/dev-setup.md, "Releasing"). Releases are rare: only when the editor changes (design, "When
# EDGEkit releases").
name: Release

on:
  workflow_dispatch:
    inputs:
      release:
        description: Make a release (tags this commit v<version> and offers the update to installed EDGEkits). Only after its installer has been tested
        type: boolean
        default: false
      nexus:
        description: Update Nexus Mods (with Make a release) - upload the installer, its changelog and the page's description
        type: boolean
        default: false

permissions:
  contents: write # the release, and the manifest commit
  actions: write # starts the docs site's deploy: a push made with this workflow's token starts no workflow

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    # VS 2022 and the Windows SDK, as on the dev PC (docs/dev-setup.md). The first run (2026-10-22) built in
    # 16 minutes and used 8.9 GB of D: (141 GB free); the runner had everything npm ci needs.
    runs-on: windows-2022
    timeout-minutes: 240
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the manifest commit rebases onto main if it moved during the build; the Nexus check compares with the previous release's description

      - name: The version is not released yet
        if: inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/release.mjs --check

      - name: Nexus Mods can take this release
        if: inputs.release && inputs.nexus
        env:
          NEXUS_KEY: ${{ secrets.NEXUS_KEY }}
        run: |
          node tools/check-bbcode.mjs
          if ($LASTEXITCODE) { exit 1 }
          $version = (Get-Content version.json -Raw | ConvertFrom-Json).version
          node tools/nexus/nexus.mjs check --version $version

      - name: Fetch Code - OSS
        run: .\tools\fetch-vscode.ps1

      # The Node version Code - OSS wants (its .nvmrc), so build.ps1 needs no nvm.
      - uses: actions/setup-node@v4
        with:
          node-version-file: build/vscode/.nvmrc

      - name: Build EDGEkit
        env:
          # Upstream's install downloads from GitHub (Electron, ripgrep); the token lifts the rate limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: .\tools\build.ps1 -SkipFetch

      - name: Check the build
        run: node tools/check-build.mjs

      - name: Disk used
        if: always()
        run: Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{ n = 'Used (GB)'; e = { [math]::Round($_.Used / 1GB, 1) } }, @{ n = 'Free (GB)'; e = { [math]::Round($_.Free / 1GB, 1) } }

      - uses: actions/upload-artifact@v4
        with:
          name: EDGEkitSetup
          path: build/vscode/.build/win32-x64/user-setup/EDGEkitSetup.exe
          if-no-files-found: error
          retention-days: 30

      - name: GitHub release
        if: inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/release.mjs

      - uses: actions/upload-artifact@v4
        if: inputs.release
        with:
          name: update-manifest
          path: docs/update/

      # Committing the manifest is what offers the update; the docs site then serves it.
      - name: Switch the update on
        if: inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content version.json -Raw | ConvertFrom-Json).version
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/update
          git commit -m "Update manifest: EDGEkit $version"
          git pull --rebase origin main
          git push origin HEAD:main
          if ($LASTEXITCODE) { throw "Pushing the manifest failed. The release is made: commit the update-manifest artifact's file to docs/update/ by hand." }
          gh workflow run pages.yml --ref main

      # Last, so that a Nexus failure leaves the release and the update as they are.
      - name: Nexus Mods
        if: inputs.release && inputs.nexus
        env:
          NEXUS_KEY: ${{ secrets.NEXUS_KEY }}
        run: |
          $version = (Get-Content version.json -Raw | ConvertFrom-Json).version
          node tools/nexus-notes.mjs --out "$env:RUNNER_TEMP/nexus-notes.txt"
          if ($LASTEXITCODE) { exit 1 }
          node tools/nexus-zip.mjs
          if ($LASTEXITCODE) { exit 1 }
          node tools/nexus/nexus.mjs release --version $version --zip "build/release/EDGEkit-$version.zip" --notes "$env:RUNNER_TEMP/nexus-notes.txt"
